<div id="main">
  <div class="row">
    <form class="saveParams col-sm-12" method="POST" action="saveParams">
      <div class="col-sm-12 cardPadding">
        <div class="card">
          <div class="card-header">
            <img src="icon_mqtt_settings.svg" class="title_icon_style" />
            <span>Connection</span>
          </div>
          <div class="card-body">
            <div class="mb-2 form-check form-switch">
              <input
                data-replace="enableMqtt"
                id="MqttEnable"
                class="form-check-input"
                type="checkbox"
                role="switch"
                name="MqttEnable"
                onclick="MqttInputDsbl(!this.checked)"
              />
              <label class="form-check-label" for="MqttEnable">Enable</label>
            </div>
            <div class="mb-2">
              <label for="MqttServer">Server</label>
              <input
                data-replace="serverMqtt"
                class="form-control"
                id="MqttServer"
                type="text"
                name="MqttServer"
                placeholder="192.168.x.x"
              />
            </div>
            <div class="mb-2">
              <label for="MqttPort">Port</label>
              <input
                data-replace="portMqtt"
                class="form-control"
                id="MqttPort"
                type="number"
                name="MqttPort"
                min="1"
                max="65535"
                placeholder="1883"
              />
            </div>
            <div class="mb-2">
              <label for="MqttUser">Username</label>
              <input
                data-replace="userMqtt"
                class="form-control"
                id="MqttUser"
                type="text"
                name="MqttUser"
                placeholder="e.g. mqttuser"
              />
            </div>
            <div class="mb-2">
              <label for="MqttPass">Password</label>
              <input
                data-replace="passMqtt"
                class="form-control"
                id="MqttPass"
                type="password"
                name="MqttPass"
                placeholder="password"
              />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <img src="icon_mqtt_settings.svg" class="title_icon_style" />
            <span>Topic &amp; Discovery</span>
          </div>
          <div class="card-body">
            <div class="mb-2">
              <label for="MqttTopic">Topic</label>
              <input
                data-replace="topicMqtt"
                class="form-control"
                id="MqttTopic"
                type="text"
                name="MqttTopic"
                placeholder="topic"
              />
            </div>
            <div class="mb-2">
              <label for="MqttInterval">Interval (seconds)</label>
              <input
                data-replace="intervalMqtt"
                class="form-control"
                id="MqttInterval"
                type="text"
                name="MqttInterval"
                placeholder="60"
              />
            </div>

            <div class="mb-2 form-check form-switch">
              <input
                data-replace="discoveryMqtt"
                class="form-check-input"
                id="MqttDiscovery"
                type="checkbox"
                role="switch"
                name="MqttDiscovery"
              />
              <label class="form-check-label" for="MqttDiscovery"
                >Enable Home Assistant Discovery</label
              >
            </div>
          </div>
        </div>

        <div class="save-row">
          <button
            type="submit"
            class="btn btn-outline-primary"
            name="save"
          >
            Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
