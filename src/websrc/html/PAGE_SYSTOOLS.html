<style>
  #console {
    font-family: monospace;
    font-size: 0.8rem;
    height: 40vh;
    min-height: 220px;
    max-height: 480px;
    margin-bottom: 12px;
  }
  .log-filter-seg {
    display: inline-flex;
    width: max-content;
    max-width: 100%;
    gap: 2px;
    padding: 4px;
    background: var(--bg-muted);
    border: 1px solid var(--border-color);
    border-radius: 8px;
  }
  .log-filter-seg button {
    margin: 0;
    border: none;
    background: transparent;
    color: var(--text-muted);
    height: 28px;
    padding: 0 14px;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .log-filter-seg button.seg-active {
    background: var(--accent);
    color: #1a1a2e;
  }
  .log-seg-row { display: flex; margin-bottom: 12px; }
  .mc-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .mc-grid .btn { flex: 1 1 calc(50% - 4px); }
  .log-tools-switches {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    column-gap: 2.5rem;
    row-gap: 6px;
    margin-bottom: 12px;
  }
  .log-tools-switches .form-check,
  .log-tools-switches .form-switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 28px;
    padding-left: 0;
    margin-bottom: 0;
  }
  .log-tools-switches .form-switch .form-check-input { margin-left: 0; }
  .log-tools-switches .form-check-input { margin: 0; flex-shrink: 0; }
  .log-tools-switches .form-check-label { line-height: 28px; }
</style>
<div id="main">
  <div class="row">
    <div class="col-sm-12 mb-4">
      <div class="card">
        <div class="card-header">
          <svg class="title_icon_style svg-icon" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><use href="icons.svg#clipboard2" /></svg>
          <span data-i18n="t.logs">Logs</span>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col">
              <div class="log-seg-row">
                <div class="log-filter-seg" id="logFilterSeg" role="group" data-i18n="d.logFilter[aria-label]" aria-label="Log filter">
                  <button type="button" data-logfilter="esp" class="seg-active" data-i18n="t.esp">ESP32</button>
                  <button type="button" data-logfilter="zb" data-i18n="t.zbFrames">Zigbee ZNP Frames</button>
                </div>
              </div>
              <div class="log-tools-switches mb-3" id="humanizeWrap">
                <div class="form-check form-switch mb-0">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    id="humanizeSw"
                    checked
                  />
                  <label class="form-check-label" for="humanizeSw" data-i18n="t.human">
                    Human-readable frames
                  </label>
                </div>
              </div>
              <textarea
                class="form-control mb-2"
                id="console"
                rows="8"
              ></textarea>
              <div class="mc-grid">
                <button
                  type="button"
                  id="clearLogBtn"
                  data-cmd="8"
                  onclick="document.getElementById('console').value = ''"
                  class="btn btn-outline-primary"
                  data-i18n="t.clear"
                >
                  Clear Console
                </button>
                <button
                  type="button"
                  data-cmd="11"
                  class="btn btn-outline-primary"
                  data-i18n="t.checkConn"
                >
                  Check Zigbee Connection
                </button>
                <button
                  type="button"
                  data-cmd="10"
                  class="btn btn-outline-primary"
                  data-i18n="t.checkVer"
                >
                  Check Zigbee Version
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-sm-12 mb-4">
      <div class="card">
        <div class="card-header">
          <img src="icon_system_control.svg" class="title_icon_style" />
          <span data-i18n="t.modCtrl">Module Control</span>
        </div>
        <div class="card-body">
          <div class="mc-grid">
            <button
              type="button"
              data-cmd="1"
              class="btn btn-outline-primary"
              data-i18n="t.rstZb"
            >
              Restart Zigbee
            </button>
            <button
              type="button"
              data-cmd="2"
              class="btn btn-outline-primary"
              data-i18n="t.zbRefresh"
            >
              Zigbee Refresh Mode
            </button>
            <button
              type="button"
              data-cmd="0"
              class="btn btn-outline-primary"
              data-i18n="t.routerRe"
            >
              Router Reconnect
            </button>
            <button
              type="button"
              data-cmd="3"
              class="btn btn-outline-primary"
              data-i18n="t.rstEsp"
            >
              Restart ESP32
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
