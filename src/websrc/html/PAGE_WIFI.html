<div id="main">
    <form class="saveParams" method="POST" action="saveParams">
      <div class="card mb-4">
        <div class="card-header">
          <img src="icon_wifi_config.svg" class="title_icon_style" />
          <span>Wi-Fi</span>
        </div>
        <div class="card-body">
          <div class="wifi-section-title">Your Network</div>
          <div class="wifi-list">
            <div class="wifi-item wifi-current" id="wifiYourRow" style="display:none">
              <div
                class="wifi-row-main"
                role="button"
                tabindex="0"
                title="IP settings"
                onclick="wifiToggleInfo()"
                onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();wifiToggleInfo();}"
              >
                <span class="wifi-signal" id="wifiYourSignal"></span>
                <span class="wifi-name" id="wifiYourName"></span>
                <span class="wifi-check" id="wifiYourCheck"></span>
                <span class="wifi-lock" id="wifiYourSec"></span>
                <span class="wifi-chev" aria-hidden="true"
                ><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M6 3.5 10.5 8 6 12.5"/></svg></span>
              </div>
              <div class="wifi-ip-panel" id="wifiIpPanel" style="display:none">
                <div class="wifi-ip-title">IP Settings</div>
                <div class="wifi-ip-row">
                  <div class="form-check form-switch">
                    <input
                      data-replace="dchp"
                      class="form-check-input"
                      id="dhcpWiFi"
                      type="checkbox"
                      role="switch"
                      name="dhcpWiFi"
                      onclick="WifiDhcpDsbl(this.checked)"
                    />
                    <label class="form-check-label" for="dhcpWiFi">DHCP</label>
                  </div>
                </div>

                <!-- Live values shown when DHCP is on and connected -->
                <div class="wifi-ip-current" id="wifiIpCurrent" style="display:none">
                  <div class="wifi-ip-note" id="wifiIpAsleep" style="display:none">
                    WiFi is asleep (Ethernet is the active uplink) - live IP
                    appears here when WiFi is used.
                  </div>
                  <div id="wifiIpCurrentValues">
                    <div class="wifi-ip-detail"><span>IP Address</span><strong id="wifiCurIp">-</strong></div>
                    <div class="wifi-ip-detail"><span>Subnet Mask</span><strong id="wifiCurMask">-</strong></div>
                    <div class="wifi-ip-detail"><span>Router</span><strong id="wifiCurGw">-</strong></div>
                  </div>
                </div>

                <div class="wifi-ip-static" id="wifiIpStatic">
                  <div class="wifi-ip-row">
                    <label for="WifiIp">IP Address</label>
                    <input
                      data-replace="ip"
                      class="form-control form-control-sm"
                      id="WifiIp"
                      type="text"
                      name="ipAddress"
                      placeholder="192.168.x.x"
                    />
                  </div>
                  <div class="wifi-ip-row">
                    <label for="WifiMask">Subnet Mask</label>
                    <input
                      data-replace="mask"
                      class="form-control form-control-sm"
                      id="WifiMask"
                      type="text"
                      name="ipMask"
                      placeholder="255.255.255.0"
                    />
                  </div>
                  <div class="wifi-ip-row">
                    <label for="WifiGateway">Default Gateway</label>
                    <input
                      data-replace="gw"
                      type="text"
                      class="form-control form-control-sm"
                      id="WifiGateway"
                      name="ipGW"
                      placeholder="192.168.x.x"
                    />
                  </div>
                </div>
                <div class="wifi-ip-actions">
                  <button type="button" class="btn btn-outline-primary btn-sm" onclick="wifiSaveIp()">Save</button>
                  <button type="button" class="btn btn-outline-danger btn-sm" onclick="wifiForget()">Forget This Network</button>
                </div>
                <div class="wifi-ip-status" id="wifiIpStatus"></div>
              </div>
            </div>
            <div class="wifi-item wifi-placeholder" id="wifiYourEmpty">
              <span class="wifi-name">No network configured</span>
            </div>
          </div>

          <div class="wifi-section-title wifi-other-title">Other Networks</div>
          <div class="wifi-list" id="wifiList">
            <div class="wifi-item wifi-placeholder">
              <span class="wifi-name">No networks yet.</span>
            </div>
          </div>

          <div class="wifi-other collapse" id="wifiOtherForm">
            <div class="wifi-other-inner">
              <input
                type="text"
                class="form-control form-control-sm"
                id="otherSsid"
                placeholder="Network name (SSID)"
                autocomplete="off"
                oninput="this.classList.remove('is-invalid')"
                onkeydown="if(event.key==='Enter'){event.preventDefault();wifiJoinOther();}"
              />
              <select
                class="form-control form-control-sm"
                id="otherSec"
                onchange="getEl('otherPass').disabled = this.value === 'open';"
              >
                <option value="wpa" selected>WPA2/WPA3</option>
                <option value="open">Open</option>
              </select>
              <input
                type="text"
                class="form-control form-control-sm wifi-pw"
                id="otherPass"
                placeholder="Password"
                autocomplete="off"
                readonly
                onpointerdown="this.readOnly=false"
                onfocus="this.readOnly=false"
                oninput="this.classList.remove('is-invalid')"
                onkeydown="if(event.key==='Enter'){event.preventDefault();wifiJoinOther();}"
              />
              <button type="button" class="btn btn-outline-primary btn-sm" onclick="wifiJoinOther()">
                Join
              </button>
              <span class="wifi-join-status" id="wifiOtherStatus"></span>
            </div>
          </div>

          <!-- hidden fields: filled by the iOS-style list so the existing save flow keeps working -->
          <input type="hidden" id="WIFISSID" name="WIFISSID" data-replace="ssid" />
          <input type="hidden" id="WIFIpassword" name="WIFIpassword" data-replace="passWifi" />
        </div>
      </div>
    </form>
</div>
<style>
  /* ===== iOS-style network list ===== */
  .wifi-section-title {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0.9rem 0.25rem 0.4rem;
  }
  .wifi-section-title:first-child { margin-top: 0; }
  .wifi-other-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Self-contained scanning spinner (independent of Bootstrap) */
  .wifi-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--text-light);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: wifi-spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes wifi-spin { to { transform: rotate(360deg); } }
  .wifi-scanning {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .wifi-list {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--bg-card);
  }

  .wifi-item {
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border-light);
    transition: background 0.15s ease;
  }
  .wifi-item:last-child { border-bottom: none; }
  .wifi-item:hover { background: var(--bg-muted); }
  .wifi-item.wifi-current { background: var(--accent-light); }
  .wifi-item.wifi-placeholder { cursor: default; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 8px; }
  .wifi-item.wifi-placeholder:hover { background: var(--bg-card); }
  .wifi-plus {
    flex-shrink: 0;
    width: 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 1.2rem;
    line-height: 16px;
  }
  /* Expanded rows and their inner panels are not clickable rows */
  .wifi-item.open,
  .wifi-item.open:hover { cursor: default; background: inherit; }
  .wifi-item.open .wifi-connect,
  .wifi-ip-panel { cursor: default; }
  /* ...but the header of an open row still collapses it on tap */
  .wifi-item.open .wifi-row-main { cursor: pointer; }
  .wifi-item.open .wifi-row-main:hover { background: var(--bg-muted); }
  .wifi-ip-panel input[type="text"],
  .wifi-ip-panel input[type="password"] { cursor: text; user-select: text; }
  .wifi-ip-panel label,
  .wifi-ip-panel button { cursor: pointer; }

  .wifi-row-main {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
  }

  /* 3-bar signal strength icon (iOS style) */
  .wifi-signal {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    width: 20px;
    height: 16px;
    flex-shrink: 0;
  }
  .wifi-signal .bar {
    width: 4px;
    border-radius: 1px;
    background: var(--text-light);
  }
  .wifi-signal .bar.b1 { height: 6px; }
  .wifi-signal .bar.b2 { height: 10px; }
  .wifi-signal .bar.b3 { height: 14px; }
  .wifi-signal .bar.on { background: var(--accent); }

  .wifi-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
    color: var(--text-main);
  }

  .wifi-check {
    flex: 0 0 22px;
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--success);
  }

  .wifi-chev {
    flex-shrink: 0;
    color: var(--text-light);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
  }
  #wifiYourRow.info-open .wifi-chev svg { transform: rotate(-90deg); }

  .wifi-lock,
  .wifi-open {
    flex-shrink: 0;
    display: inline-flex;
    color: var(--text-muted);
  }
  .wifi-lock svg,
  .wifi-open svg {
    width: 14px;
    height: 14px;
  }

  .wifi-chev {
    flex-shrink: 0;
    color: var(--text-light);
    font-size: 1.1rem;
    line-height: 1;
  }
  /* Chevron points down when closed, up when open */
  .wifi-chev svg { transform: rotate(90deg); transition: transform 0.2s ease; }
  .wifi-item.open .wifi-chev svg { transform: rotate(-90deg); }

  /* Shimmering "Connecting…" (text sweep, left to right). Linear keeps the
     sweep visible for the whole cycle; slower duration reads as calmer. */
  .wifi-join-status.connecting {
    font-weight: 600;
    background: linear-gradient(90deg, var(--text-muted) 25%, var(--accent) 50%, var(--text-muted) 75%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: wifi-shimmer 6s linear infinite;
  }
  @keyframes wifi-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  /* Expanded join row (slides in below the tapped network) */
  .wifi-connect {
    display: none;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    flex-wrap: wrap;
  }
  .wifi-item.open .wifi-connect { display: flex; }
  /* Input takes all remaining width; both share one height and center
     their text via normal line-height + flex (no line-height:40px hack,
     which rendered 1-2px off between input and button) */
  .wifi-connect .form-control {
    flex: 1 1 auto;
    width: auto;
    min-width: 0;
    height: 40px;
    margin: 0;
    padding: 0 1rem;
  }
  .wifi-connect .btn,
  .wifi-other-inner .btn {
    flex: 0 0 auto;
    height: 40px;
    margin: 0;
    padding: 0 1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }
  .wifi-join-status {
    flex-basis: 100%;
    font-size: 0.8rem;
  }
  .wifi-join-status.ok { color: var(--success); }
  .wifi-join-status.err { color: var(--danger); }

  /* Inline IP settings panel (revealed by the info button) */
  .wifi-ip-panel {
    border-top: 1px solid var(--border-light);
    padding: 0.75rem 1rem 0.9rem;
    background: var(--bg-card);
  }
  .wifi-ip-title {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
  }
  .wifi-ip-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
  }
  .wifi-ip-row label {
    width: 110px;
    flex-shrink: 0;
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-main);
  }
  .wifi-ip-row input[type="text"] { flex: 1; }
  .wifi-ip-current {
    border: 1px dashed var(--border-color);
    border-radius: var(--radius);
    padding: 0.6rem 0.75rem;
    margin-bottom: 0.5rem;
  }
  .wifi-ip-detail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 0.15rem 0;
  }
  .wifi-ip-detail span { color: var(--text-muted); }
  .wifi-ip-detail strong { font-weight: 600; color: var(--text-main); }
  .wifi-ip-note {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.45;
    padding: 0.1rem 0;
  }
  .wifi-ip-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.6rem;
  }
  .wifi-ip-status {
    font-size: 0.8rem;
    margin-top: 0.4rem;
  }
  .wifi-ip-status.ok { color: var(--success); }
  .wifi-ip-status.err { color: var(--danger); }

  /* Join-other inputs share the same height */
  .wifi-other-inner .form-control {
    height: 40px;
    padding: 0 1rem;
  }
  /* Masked text input instead of type=password: keeps Safari/Chrome from
     offering to save the password (this form saves credentials for the
     device, not for the browser). Firefox lacks text-security and falls
     back to a real password input via JS. */
  input.wifi-pw { -webkit-text-security: disc; }

  /* Join-other panel attaches seamlessly to the bottom of the network card */
  .wifi-other {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-top: none;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    overflow: hidden;
  }

  .wifi-other-inner {
    display: grid;
    grid-template-columns: 1fr 150px;
    gap: 8px;
    align-items: center;
    padding: 0.75rem;
  }
  .wifi-other-inner #otherSsid { grid-column: 1; }
  .wifi-other-inner #otherSec { grid-column: 2; width: 100%; }
  .wifi-other-inner #otherPass { grid-column: 1; }
  .wifi-other-inner .btn { grid-column: 2; justify-self: stretch; }
  .wifi-other-inner .wifi-join-status { grid-column: 1 / -1; }

  @media (max-width: 768px) {
    .wifi-row-main { padding: 0.65rem 0.85rem; }
    .wifi-connect { padding: 0.65rem 0.85rem; }
    .wifi-name { font-size: 0.95rem; }
  }

  [data-theme="dark"] .wifi-list { background: var(--bg-card); border-color: var(--border-color); }
  [data-theme="dark"] .wifi-item.wifi-current { background: rgba(245, 166, 35, 0.12); }
  [data-theme="dark"] .wifi-info { background: #2a2a4a; }
  [data-theme="dark"] .wifi-ip-panel { background: var(--bg-card); }
  [data-theme="dark"] .wifi-ip-current { border-color: var(--border-color); }
  [data-theme="dark"] .wifi-signal .bar.on { background: var(--accent); }
</style>
