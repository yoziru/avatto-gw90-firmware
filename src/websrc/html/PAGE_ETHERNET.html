<div id="main">
  <div class="row">
    <form class="saveParams col-sm-12" method="POST" action="saveParams">
      <div class="col-sm-12 cardPadding">
        <div class="card">
          <div class="card-header">
            <img
              src="icon_ethernet_config.svg"
              class="title_icon_style"
            />
            <span data-i18n="e.conn">Connection</span>
          </div>

          <div class="card-body">
            <div class="form-check form-switch mb-3">
              <input
                data-replace="modeEther"
                id="EthDhcpTog"
                class="form-check-input"
                type="checkbox"
                role="switch"
                name="dhcp"
                onclick="EthInputDsbl(this.checked)"
              />
              <label class="form-check-label" for="EthDhcpTog" data-i18n="e.dhcp">Enable DHCP (recommended)</label>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <img
              src="icon_ethernet_config.svg"
              class="title_icon_style"
            />
            <span data-i18n="e.ipSet">IP Settings</span>
          </div>

          <div class="card-body">
            <div class="mb-2">
              <label for="EthIp" data-i18n="e.ip">IP</label>
              <input
                data-replace="ipEther"
                class="form-control"
                id="EthIp"
                type="text"
                name="ipAddress"
                placeholder="192.168.x.x"
              />
            </div>
            <div class="mb-2">
              <label for="EthMask" data-i18n="e.mask">Subnet Mask</label>
              <input
                data-replace="maskEther"
                class="form-control"
                id="EthMask"
                type="text"
                name="ipMask"
                placeholder="255.255.255.0"
              />
            </div>
            <div class="mb-2">
              <label for="EthGateway" data-i18n="e.gw">Default Gateway</label>
              <input
                data-replace="GWEther"
                type="text"
                class="form-control"
                id="EthGateway"
                name="ipGW"
                placeholder="192.168.x.x"
              />
            </div>
          </div>
        </div>

        <div class="save-row">
          <button
            type="submit"
            class="btn btn-outline-primary"
            name="save"
            data-i18n="c.save"
          >
            Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
