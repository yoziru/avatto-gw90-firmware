<div id="main">
  <form class="saveParams" method="POST" action="saveParams">
    <div class="card">
      <div class="card-header">
        <img src="icon_serial_settings.svg" class="title_icon_style" alt="" >
        <span data-i18n="z.serSet">Serial Settings</span>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-sm-12 col-md-6 mb-4">
            <div class="form-group">
              <label for="baud" data-i18n="z.baud">Baud Rate</label>
              <select class="form-select" id="baud" name="baud">
                <option data-replace="9600" value="9600">9600 Baud</option>
                <option data-replace="19200" value="19200">19200 Baud</option>
                <option data-replace="38400" value="38400">38400 Baud</option>
                <option data-replace="57600" value="57600">57600 Baud</option>
                <option data-replace="115200" value="115200">
                  115200 Baud
                </option>
              </select>
            </div>
          </div>
          <div class="col-sm-12 col-md-6 mb-4">
            <div class="form-group">
              <label for="port" data-i18n="z.port">Port</label>
              <input
                data-replace="socketPort"
                class="form-control"
                id="port"
                type="number"
                name="port"
                min="100"
                max="65000"
                placeholder="6638"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="save-row">
      <button
        type="submit"
        class="btn btn-outline-primary"
        name="save"
        data-i18n="c.save"
      >
        Save
      </button>
    </div>
  </form>

  <div class="card mt-2">
    <div class="card-header">
      <img src="icon_config_generator.svg" class="title_icon_style" alt="" >
      <span data-i18n="z.cfgGen">Config Generator</span>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-sm-12">
          <div class="form-group">
            <div
              class="alert alert-warning visually-hidden"
              role="alert"
              id="apAlert"
              data-i18n="z.apAlert"
            >
              It seems that AVATTO-GW90-Ti is operating in access point mode (IP address is 192.168.1.1).
              The IP address will change after connecting to Ethernet or Wi-Fi, and the configuration needs to be regenerated.
            </div>
            <label for="generatedFile" data-i18n="z.cfgGenLabel">Config Generator</label>
            <div class="seg mb-2" id="genSeg" role="group" aria-label="Config generator type">
              <button type="button" class="seg-active" data-gen="z2m" aria-pressed="true" onclick="selectGenerator(this)">Zigbee2MQTT</button>
              <button type="button" data-gen="zha" aria-pressed="false" onclick="selectGenerator(this)">ZHA</button>
              <button type="button" data-gen="usb" aria-pressed="false" onclick="selectGenerator(this)">USB</button>
            </div>
            <textarea
              class="form-control mb-2"
              id="generatedFile"
              name="file"
              rows="8"
            ></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="save-row">
    <button
      type="button"
      class="btn btn-outline-primary"
      onclick="copyCode()"
      data-i18n="z.copy"
    >
      Copy to Clipboard
    </button>
  </div>
</div>
