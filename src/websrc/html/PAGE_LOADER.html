<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="css/required.css" rel="stylesheet" type="text/css" />
    <title data-replace="pageName"></title>
  </head>

  <body>
    <div id="uzPreloader">
      <div class="page-loader"></div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div
        class="toast fade toast_show hide"
        data-bs-autohide="false"
        role="alert"
      >
        <div class="toast-header">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="currentColor"
            class="bi bi-info-circle"
            viewBox="0 0 16 16"
            reserveAspectRatio="xMidYMid slice"
            focusable="false"
            role="img"
          >
            <!-- fix new icon -->
            <use href="icons.svg#info-square" />
          </svg>
          <strong
            class="mr-auto"
            style="padding-left: 10px"
            id="toastHeaderText"
            >Tips</strong
          >
        </div>
        <div class="toast-body">
          <div id="toastBody"></div>
          <div class="mt-2 pt-2 border-top" id="toastButtons">
            <button
              type="button"
              class="btn btn-outline-primary"
              data-bs-dismiss="toast"
              onclick="localStorage.setItem('refresh_tip_got', 1)"
            >
              Got it
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="modal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="100"
      aria-modal="true"
      role="dialog"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Modal title</h5>
            <button
              type="button"
              class="btn-close visually-hidden modal-btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer" id="modalButtons"></div>
        </div>
      </div>
    </div>
    <nav class="navbar shadow sticky-top navbar-dark bg-dark">
      <div class="container-fluid">
        <span
          class="navbar-toggler-icon"
          onclick="
              document.getElementById('sidenav').classList.toggle('sidenav-active');
            "
        ></span>
        <h2
          data-replace="pageName"
          class="text-white"
        ></h2>
        <select id="langSel" class="form-select form-select-sm ms-auto me-1 navbar-lang" style="width:auto;"></select>
        <span id="darkModeToggleMobile" class="navbar-dark-icon" onclick="toggleDarkModeMobile()" title="Toggle dark mode">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
          </svg>
        </span>
        <a href="/logout" class="btn logoutLink nav-link visually-hidden">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="25"
            height="25"
            fill="currentColor"
            class="bi bi-door-open"
            viewBox="0 0 16 16"
          >
            <use href="icons.svg#door-open" />
          </svg>
          <span>Logout</span>
        </a>
      </div>
    </nav>
    <div class="container-fluid">
      <div class="row flex-nowrap">
        <div
          id="sidenav"
          class="col-auto nav-container px-0 col-md-3 col-xl-2 bg-dark-grey nav-shadow"
        >
          <div
            class="d-flex flex-column align-items-center align-items-sm-start pt-2 text-white min-vh-100"
          >
            <div class="logo-wrapper">
              <a>
                <img
                  src="AVATTO.svg"
                  alt="AVATTO Logo"
                  class="d-inline-block align-text-middle"
                />
                <!-- <span class='fs-5 d-none d-sm-inline'>AVATTO-GW90-Ti</span> -->
              </a>
            </div>
            <ul

                    class="bi bi-house"
                    viewBox="0 0 16 16"

                    <use href="icons.svg#house" />

                </a>
              </li>
              <li class="nav-item">
                <a href="/general" class="nav-link align-middle">

                </a>
              </li>
              <li class="nav-item">
              <li class="nav-item">

                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-ethernet"
                    viewBox="0 0 16 16"
                  >
                    <use href="icons.svg#ethernet" />
                  </svg>
                  <span class="ms-1" data-i18n="l.ne">Ethernet</span>
                </a>
              </li>
              <li class="nav-item">
                <a href="/wifi" class="nav-link align-middle">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-wifi"
                    viewBox="0 0 16 16"
                  >
                    <use href="icons.svg#wifi" />
                  </svg>
                  <span class="ms-1">WiFi</span>
                </a>
              </li>
              <li class="nav-item">
                <a href="/zha-z2m" class="nav-link align-middle">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-activity"
                    viewBox="0 0 16 16"

                    <use href="icons.svg#activity" />
                  </svg>
                  <span class="ms-1" data-i18n="l.zi">Z2M/ZHA</span>
                </a>
              </li>
              <li class="nav-item">
                <a href="/security" class="nav-link align-middle">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-lock"
                    viewBox="0 0 16 16"

                    <use href="icons.svg#lock" />
                  </svg>
                  <span class="ms-1" data-i18n="l.se">Security</span>
                </a>
              </li>
              <li class="nav-item">
                <a href="/mqtt" class="nav-link align-middle">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-mqtt"
                    viewBox="0 0 16 16"
                  >
                    <use href="icons.svg#mqtt" />
                  </svg>
                  <span class="ms-1" data-i18n="l.mq">MQTT</span>
                </a>
              </li>
              <li class="nav-item">
                <a href="/wg" class="nav-link align-middle">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-vpn"
                    viewBox="0 0 16 16"

                    <use href="icons.svg#vpn" />
                  </svg>

                </a>
              </li>
              <li class="nav-item">
                <a href="/sys-tools" class="nav-link align-middle">

                    xmlns="http://www.w3.org/2000/svg"
                    width="25"

                    class="bi bi-cpu"
                    viewBox="0 0 16 16"
                  >
                    <use href="icons.svg#cpu" />
                  </svg>
                  <span class="ms-1" data-i18n="l.to">Tools</span>
                </a>
              </li>
              <li class="nav-item">
                <a href="/about" class="nav-link align-middle">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-info-square"
                    viewBox="0 0 16 16"
                  >
                    <use href="icons.svg#info-square" />
                  </svg>
                  <span class="ms-1" data-i18n="l.ab">About</span>
                   <!-- <span class="ms-1 d-none d-sm-inline">About</span> -->
                </a>
              </li>
              <li class="nav-item logoutLink visually-hidden">
                <a
                  href="/logout"
                  class="nav-link align-middle d-none d-sm-inline"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-door-open"
                    viewBox="0 0 16 16"
                  >
                    <use href="icons.svg#door-open" />
                  </svg>
                  <span class="ms-1" data-i18n="l.lo">Logout</span>
                </a>
              </li>
            </ul>
            <div class="mt-auto p-3 w-100 sidebar-lang">
              <select id="langSelSide" class="form-select form-select-sm lang_select" style="width:100%;"></select>
              <div class="form-check form-switch mt-2" style="padding-left: 2.5em;">
                <input class="form-check-input" type="checkbox" role="switch" id="darkModeToggle" style="width:1.5em;margin-left:-2.5em;">
                <label class="form-check-label" for="darkModeToggle" style="color:rgba(255,255,255,0.6);font-size:0.8rem;">Dark Mode</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col py-3 col-md-9 col-xl-10">
          <h2 data-replace="pageName" class="mb-3" id="pagenamePC"></h2>
          <div id="pageContent" class="container"></div>
          <h6
            class="fixed-bottom"
            style="
              text-align: right;
              color: #0000007a;
              margin-bottom: 0;
              font-weight: 100;
              font-size: 60%;
            "
          >
            © 2026 AVATTO
          </h6>
        </div>
      </div>
    </div>
    <script type="text/javascript" src="/js/functions.js"></script>
  </body>
</html>
