<div id="main">
  <div class="row">
    <div class="col-sm-12">
      <form class="saveParams" method="POST" action="saveParams">
        <!-- Work Mode Selection -->
        <div class="card mb-4">
          <div class="card-header">
            <img src="workMode_selection.svg" class="title_icon_style" />
            <span>Work Mode</span>
          </div>
          <div class="card-body">
            <div
              class="row"
              onclick="KeepWebDsbl(!document.getElementById('serialMode').checked)"
            >
              <!-- Network Mode (recommended) -->
              <div class="col-12 mb-3">
                <div class="mode-option">
                  <label class="mode-option-inner" for="networkMode">
                    <input
                      data-replace="checkedNetworkMode"
                      class="form-check-input mode-radio"
                      type="radio"
                      name="coordMode"
                      id="networkMode"
                      value="0"
                    />
                    <img src="lan_connection.svg" alt="" class="mode-icon" />
                    <span class="mode-text">
                      <span class="mode-title">
                        <strong>Network Mode</strong>
                        <span class="recommended-badge">Recommended</span>
                      </span>
                      <span class="mode-desc">Ethernet with automatic Wi-Fi fallback</span>
                    </span>
                  </label>
                </div>
              </div>

              <!-- Serial Mode + Keep Network & Web -->
              <div class="col-12 mb-3">
                <div class="mode-option">
                  <label class="mode-option-inner" for="serialMode">
                    <input
                      data-replace="checkedSerialMode"
                      class="form-check-input mode-radio"
                      type="radio"
                      name="coordMode"
                      id="serialMode"
                      value="1"
                    />
                    <img src="usb_connection.svg" alt="" class="mode-icon" />
                    <span class="mode-text">
                      <span class="mode-title"><strong>Serial Mode</strong></span>
                      <span class="mode-desc">Directly connect to computer via USB (serial test)</span>
                    </span>
                  </label>
                  <div class="mode-option-extra">
                    <div class="form-check form-check-inline mb-0">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="keepWeb"
                        name="keepWeb"
                        data-replace="keepWeb"
                      />
                      <label class="form-check-label" for="keepWeb">
                        Keep Network &amp; Web
                      </label>
                    </div>
                    <p class="mode-extra-hint">
                      Keeps one channel active (Wi-Fi, Ethernet or Wi-Fi AP, in that order) so the web interface stays reachable.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Real-time Control -->
        <div class="card mb-4">
          <div class="card-header">
            <img src="realTime_control.svg" class="title_icon_style" />
            <span>Real-time Control</span>
          </div>
          <div class="card-body">
            <div class="row">
              <!-- LED Control Buttons -->
              <div class="col-12 mb-3">
                <div class="text-center mb-3">
                  <small class="text-muted"
                    > Use toggle buttons to control LED status (current session, not saved after reboot)</small
                  >
                </div>
                <div class="d-flex justify-content-center flex-wrap gap-2">
                  <button type="button" data-cmd="6" class="btn btn-info">
                    Power Indicator LED
                  </button>
                  <button type="button" data-cmd="7" class="btn btn-danger">
                    Wi-Fi/Serial Mode LED
                  </button>
                </div>
              </div>

              <!-- LED Switches -->
              <div class="col-12">
                <div class="p-3 bg-light rounded">
                  <div class="mb-2">
                    <small class="text-muted"
                     >Use the switches below to control LED behavior (saved after reboot)</small
                    >
                  </div>
                  <div class="form-check form-switch mb-2">
                    <input
                      data-replace="checkedDisableLedPwr"
                      class="form-check-input"
                      id="disableLedPwr"
                      type="checkbox"
                      role="switch"
                      name="disableLedPwr"
                    />
                    <label class="form-check-label" for="disableLedPwr">
                      Disable Power LED
                    </label>
                  </div>
                  <div class="form-check form-switch">
                    <input
                      data-replace="checkedDisableLedUSB"
                      class="form-check-input"
                      id="disableLedUSB"
                      type="checkbox"
                      role="switch"
                      name="disableLedUSB"
                    />
                    <label class="form-check-label" for="disableLedUSB">
                        Disable USB LED
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Save Button -->
        <div class="save-row">
          <button
            type="submit"
            class="btn btn-outline-primary"
            name="save"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
