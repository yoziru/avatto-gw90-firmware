[platformio]
default_envs = prod-solo

[env]
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
	rlogiacco/CircularBuffer@1.4.0
	sstaub/Ticker@4.4.0
	knolleary/PubSubClient@2.8.0
monitor_filters = esp32_exception_decoder, default ;, log2file
monitor_speed = 115200
upload_speed = 460800
extra_scripts = 
	pre:tools/version_increment_pre.py
	pre:tools/webfilesbuilder/build_html.py
	pre:tools/webfilesbuilder/gen_routes.py
	post:tools/version_increment_post.py
	post:tools/build.py
build_flags = 
	-DBUILD_ENV_NAME=$PIOENV
	-std=gnu++17
build_unflags = 
	-std=gnu++11
check_tool = cppcheck
check_flags = cppcheck: --suppress=uninitMemberVar:*/ArduinoJson/* --suppress=duplInheritedMember:*/ArduinoJson/* --suppress=uninitMemberVar:*/CircularBuffer/* --suppress=preprocessorErrorDirective:*/ArduinoJson/*
	

[env:prod-solo]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.07.00/platform-espressif32.zip
board = esp32-solo1
build_flags = 
	${env.build_flags}
	-DFRAMEWORK_ARDUINO_SOLO1
board_build.f_cpu = 160000000L
board_upload.flash_size = 16MB  ; Set flash size (supports 2MB/4MB/8MB/16MB etc.)
board_build.partitions = partitions.csv
extra_scripts = 
	${env.extra_scripts}

[env:debug-solo]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.07.00/platform-espressif32.zip
board = esp32-solo1
build_flags = 
	-DDEBUG
	-DBUILD_DEBUG
	${env.build_flags}
	-DFRAMEWORK_ARDUINO_SOLO1
board_build.f_cpu = 160000000L
board_build.partitions = partitions.csv
extra_scripts = 
	${env.extra_scripts}


[env:factory-test-solo]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.07.00/platform-espressif32.zip
board = esp32-solo1
build_flags = 
	-DBUILD_FACTORY_TEST
	${env.build_flags}
	-DFRAMEWORK_ARDUINO_SOLO1
board_build.f_cpu = 160000000L
board_build.partitions = partitions.csv
extra_scripts = 
	${env.extra_scripts}


[env:prod]
platform = espressif32 @ 6.4.0
board = esp32dev
build_flags = 
	${env.build_flags}
extra_scripts = 
	${env.extra_scripts}


[env:debug]
platform = espressif32 @ 6.4.0
board = esp32dev
build_flags = 
	-DDEBUG
	-DBUILD_DEBUG
	${env.build_flags}
extra_scripts = 
	${env.extra_scripts}

[env:native]
platform = native
build_type = debug
framework =
lib_deps =
	throwtheswitch/Unity@2.6.1
	bblanchon/ArduinoJson@7.4.3
	rlogiacco/CircularBuffer@1.4.0
build_flags =
	-DUNIT_TEST
	-I src
	-std=gnu++17

