; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = prod

[env]
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
	rlogiacco/CircularBuffer@1.4.0
	sstaub/Ticker@4.4.0
	hmueller01/PubSubClient3@3.3.0
	https://github.com/Tinkerforge/WireGuard-ESP32-Arduino.git#96032fd0855d355b6ae858b41e2e8b9b4e76c916
monitor_filters = esp32_exception_decoder, default ;, log2file
monitor_speed = 115200
upload_speed = 460800
extra_scripts = 
	pre:tools/gen_version.py
	pre:tools/webfilesbuilder/build_html.py
	pre:tools/webfilesbuilder/gen_routes.py
	post:tools/build.py
build_flags = 
	-DBUILD_ENV_NAME=$PIOENV
	-std=gnu++17
build_unflags = 
	-std=gnu++11
check_tool = cppcheck
check_flags = cppcheck: --suppress=uninitMemberVar:*/ArduinoJson/* --suppress=duplInheritedMember:*/ArduinoJson/* --suppress=uninitMemberVar:*/CircularBuffer/* --suppress=preprocessorErrorDirective:*/ArduinoJson/*
	

[env:prod]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
build_flags = 
	${env.build_flags}
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB  ; Set flash size (supports 2MB/4MB/8MB/16MB etc.)
board_build.partitions = partitions.csv
extra_scripts = 
	${env.extra_scripts}

[env:debug]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
build_flags = 
	-DDEBUG
	-DBUILD_DEBUG
	${env.build_flags}
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
extra_scripts = 
	${env.extra_scripts}


[env:factory-test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
build_flags = 
	-DBUILD_FACTORY_TEST
	${env.build_flags}
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
extra_scripts = 
	${env.extra_scripts}

[env:native]
platform = native
lib_ignore = IntelHex
build_type = debug
framework =
lib_deps =
	throwtheswitch/Unity@2.6.1
	bblanchon/ArduinoJson@7.4.3
	rlogiacco/CircularBuffer@1.4.0
build_flags =
	-DUNIT_TEST
	-I src
	-std=gnu++17
