[tools]
python = "3.14"
node = "24.15"

[tasks.setup]
description = "Install project dependencies (uv sync + build group)"
run = "uv sync --group build"

[tasks.build]
description = "Build prod-solo firmware"
depends = ["setup"]
run = "uv run pio run -e prod-solo -t clean && uv run pio run -e prod-solo"

[tasks."build:debug"]
description = "Build debug-solo firmware"
depends = ["setup"]
run = "uv run pio run -e debug-solo -t clean && uv run pio run -e debug-solo"

[tasks.flash]
description = "Flash prod-solo firmware (set UPLOAD_PORT env var)"
depends = ["setup", "build"]
run = "uv run pio run -e prod-solo -t upload --upload-port ${UPLOAD_PORT:-/dev/cu.usbserial-XXXX}"

[tasks."flash:debug"]
description = "Flash debug-solo firmware (set UPLOAD_PORT env var)"
depends = ["setup", "build:debug"]
run = "uv run pio run -e debug-solo -t upload --upload-port ${UPLOAD_PORT:-/dev/cu.usbserial-XXXX}"

[tasks.monitor]
description = "Open serial monitor (set MONITOR_PORT env var)"
depends = ["setup"]
run = "uv run pio device monitor -b 115200 --port ${MONITOR_PORT:-/dev/cu.usbserial-XXXX}"

[tasks.clean]
description = "Clean all build artifacts"
depends = ["setup"]
run = "uv run pio run --target clean"

[tasks."build:all"]
description = "Build all environments"
depends = ["setup"]
run = "uv run pio run"

[tasks.test]
description = "Run unit tests (native)"
depends = ["setup"]
run = "uv run pio test -e native"

[tasks."flash:ota"]
description = "Flash over network OTA (set OTA_DEVICE_IP)"
depends = ["setup", "build"]
run = '''
  BIN="bin/AVATTO-GW90-Ti.bin"
  if [ ! -f "$BIN" ]; then echo "Firmware not found: $BIN"; exit 1; fi
  DEVICE_IP="${OTA_DEVICE_IP:?Set OTA_DEVICE_IP env var}"
  echo "Uploading firmware to http://$DEVICE_IP/update ..."
  curl -v -F "firmware=@$BIN;filename=$(basename $BIN)" "http://$DEVICE_IP/update" 2>&1
  echo ""
  echo "OTA triggered. Waiting for device to come back..."
  for i in $(seq 1 60); do
    sleep 2
    STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 "http://$DEVICE_IP/" 2>/dev/null)
    if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "401" ]; then
      echo "Device is back online! ($((i*2))s)"
      break
    fi
    echo "  waiting... ($((i*2))s)"
  done
  echo "Done."
'''
