[tools]
python = "3.14"
node = "24.15"

[tasks.setup]
description = "Install project dependencies (uv sync + build group)"
run = "uv sync --group build"

[tasks.build]
description = "Build prod firmware"
depends = ["setup"]
run = "uv run pio run -e prod -t clean && uv run pio run -e prod"

[tasks."build:debug"]
description = "Build debug firmware"
depends = ["setup"]
run = "uv run pio run -e debug -t clean && uv run pio run -e debug"

[tasks.flash]
description = "Flash prod firmware (set UPLOAD_PORT env var)"
depends = ["setup", "build"]
run = "uv run pio run -e prod -t upload --upload-port ${UPLOAD_PORT:-/dev/cu.usbserial-XXXX}"

[tasks."flash:debug"]
description = "Flash debug firmware (set UPLOAD_PORT env var)"
depends = ["setup", "build:debug"]
run = "uv run pio run -e debug -t upload --upload-port ${UPLOAD_PORT:-/dev/cu.usbserial-XXXX}"

[tasks.monitor]
description = "Open serial monitor (set MONITOR_PORT env var)"
depends = ["setup"]
run = "uv run pio device monitor -b 115200 --port ${MONITOR_PORT:-/dev/cu.usbserial-XXXX}"

[tasks.clean]
description = "Clean all build artifacts"
depends = ["setup"]
run = "uv run pio run --target clean"

[tasks."build:all"]
description = "Build all environments"
depends = ["setup"]
run = "uv run pio run"

[tasks.test]
description = "Run unit tests (native)"
depends = ["setup"]
run = "uv run pio test -e native"

[tasks.lint]
description = "Static analysis with cppcheck (fails on high-severity defects)"
depends = ["setup"]
run = "uv run pio check -e prod --fail-on-defect high --skip-packages"

[tasks."lint:full"]
description = "Static analysis with cppcheck, medium+ gate (skips platform packages)"
depends = ["setup"]
run = "uv run pio check -e prod --fail-on-defect medium --skip-packages"

[tasks."flash:ota"]
description = "Flash prod firmware over network OTA (set OTA_DEVICE_IP; optional OTA_USER/OTA_PASS for web auth)"
depends = ["setup", "build"]
run = "sh scripts/ota_flash.sh"

[tasks."flash:ota:debug"]
description = "Flash debug firmware (with profiler) over network OTA (set OTA_DEVICE_IP; optional OTA_USER/OTA_PASS)"
depends = ["setup", "build:debug"]
run = "sh scripts/ota_flash.sh"
