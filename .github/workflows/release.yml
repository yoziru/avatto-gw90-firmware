name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit version override (X.Y.Z)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run releases from main only" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          release_arg="$INPUT_VERSION"
          if [ -z "$release_arg" ]; then
            release_arg="$INPUT_BUMP"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/release.sh "$release_arg"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build prod firmware
        run: pio run -e prod

      - name: Check embedded public key is current
        run: |
          python3 tools/gen_pubkey.py
          if ! git diff --exit-code --quiet src/fw_pubkey.h; then
            echo "::error::src/fw_pubkey.h is out of sync with keys/fw-signing-pub.pem. Run 'python3 tools/gen_pubkey.py' and commit the result."
            exit 1
          fi

      - name: Sign prod firmware
        env:
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
        run: |
          if [ -z "$FW_SIGNING_KEY" ]; then
            echo "::error::FW_SIGNING_KEY secret is not set - refusing to publish an unsigned release. Generate a keypair and add the private key as FW_SIGNING_KEY (see README > Signed firmware)."
            exit 1
          fi
          printf '%s\n' "$FW_SIGNING_KEY" > "$RUNNER_TEMP/fw-signing-key.pem"
          trap 'rm -f "$RUNNER_TEMP/fw-signing-key.pem"' EXIT
          openssl dgst -sha256 -sign "$RUNNER_TEMP/fw-signing-key.pem" -out bin/AVATTO-GW90-Ti.bin.sig bin/AVATTO-GW90-Ti.bin
          openssl dgst -sha256 -verify keys/fw-signing-pub.pem -signature bin/AVATTO-GW90-Ti.bin.sig bin/AVATTO-GW90-Ti.bin

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(tr -d '\n' < tools/version)
          NOTES_FILE=$(mktemp)
          VERSION="$VERSION" python3 > "$NOTES_FILE" <<'PY'
          import os, re, sys

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## v{re.escape(version)} — .+?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          if m and m.group(1).strip():
              print(m.group(1).strip())
          PY
          if [ -s "$NOTES_FILE" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$NOTES_FILE" \
              bin/AVATTO-GW90-Ti.bin bin/AVATTO-GW90-Ti.bin.sig "bin/AVATTO-GW90-Ti_v${VERSION}.full.bin"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
              bin/AVATTO-GW90-Ti.bin bin/AVATTO-GW90-Ti.bin.sig "bin/AVATTO-GW90-Ti_v${VERSION}.full.bin"
          fi
