name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit version override (X.Y.Z)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run releases from main only" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          release_arg="$INPUT_VERSION"
          if [ -z "$release_arg" ]; then
            release_arg="$INPUT_BUMP"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/release.sh "$release_arg"

      - name: Cache PlatformIO
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.15"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build prod firmware
        run: pio run -e prod

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(tr -d '\n' < tools/version)
          NOTES_FILE=$(mktemp)
          VERSION="$VERSION" python3 > "$NOTES_FILE" <<'PY'
          import os, re, sys

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## v{re.escape(version)} — .+?\n(.*?)(?=^## )", text, re.S | re.M)
          if not (m and m.group(1).strip()):
              sys.exit(1)  # fall back to --generate-notes
          print(m.group(1).strip())
          PY
          if [ -s "$NOTES_FILE" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$NOTES_FILE" \
              bin/AVATTO-GW90-Ti.bin "bin/AVATTO-GW90-Ti_v${VERSION}.full.bin"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
              bin/AVATTO-GW90-Ti.bin "bin/AVATTO-GW90-Ti_v${VERSION}.full.bin"
          fi
