name: PlatformIO CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build prod firmware
        run: pio run -e prod

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: firmware
          path: |
            bin/AVATTO-GW90-Ti.bin
            bin/AVATTO-GW90-Ti_v*.full.bin
          if-no-files-found: error

  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build debug firmware
        run: pio run -e debug

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run unit tests
        run: pio test -e native

      - name: Check HEX parser safety
        run: python tools/test_intelhex.py

      - name: Check Zigbee flash failures
        run: python tools/test_zigbee_flash.py

      - name: Check bootloader packet safety
        run: python tools/test_cctools.py

      - name: Check early OTA rollback
        run: python tools/test_boot_guard.py

      - name: Check OTA transfer and uploader failures
        run: |
          python tools/test_ota_transfer.py
          python tools/test_ota_script.py

      - name: Check network recovery and radio ownership
        run: python tools/test_network_recovery.py

      - name: Check reset and MQTT contracts
        run: |
          python tools/test_config_contracts.py
          python tools/test_clock_logs.py

      - name: Check packaging and release notes
        run: python tools/test_build_release.py

      - name: Check frontend contracts
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15'

      - name: Run frontend contracts
        run: node tools/test_frontend.cjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Static analysis (cppcheck, high severity gate)
        run: pio check -e prod --fail-on-defect high --skip-packages
