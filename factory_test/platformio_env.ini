; ============================================================
;  AVATTO GW90-TI Factory Test Firmware PlatformIO Env Config
; ============================================================
;
;  Usage:
;    1. Append this file content to the project root platformio.ini
;    2. Copy factory_test/factory_test_main.cpp to src/ directory
;       (backup original main.cpp before building, or use src_filter to switch)
;    3. Run: pio run -e factory-test-solo
;
;  Or use the src_dir approach below (recommended):
;    Build directly, source files in factory_test/ directory
;
; ============================================================

; --- Option 1: Independent source directory (recommended) ---
; Add the following environment to platformio.ini

[env:factory-test-solo]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.07.00/platform-espressif32.zip
board = esp32-solo1
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@6.21.3
build_flags = 
	-DBUILD_ENV_NAME=$PIOENV
	-DFRAMEWORK_ARDUINO_SOLO1
	-DFACTORY_TEST
board_build.f_cpu = 160000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
; Manually specify source files — only compile factory test firmware
build_src_filter = 
	-<*>
	+<../factory_test/factory_test_main.cpp>
lib_extra_dirs = lib
